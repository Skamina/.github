<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Administration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏫 School Administration System</h1>
            <p class="subtitle">Manage schools and students efficiently</p>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <h3 id="totalSchools">0</h3>
                <p>Total Schools</p>
            </div>
            <div class="stat-card">
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>
            <div class="stat-card">
                <h3 id="activeStudents">0</h3>
                <p>Active Students</p>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('schools')">Schools</button>
            <button class="tab-button" onclick="showTab('students')">Students</button>
        </div>

        <!-- Schools Section -->
        <div id="schools-section" class="tab-content active">
            <div class="section-header">
                <h2>Schools</h2>
                <button class="btn btn-primary" onclick="showSchoolForm()">+ Add School</button>
            </div>

            <div id="schoolForm" class="form-container" style="display: none;">
                <h3 id="schoolFormTitle">Add New School</h3>
                <form onsubmit="saveSchool(event)">
                    <input type="hidden" id="schoolId">
                    <div class="form-group">
                        <label>School Name *</label>
                        <input type="text" id="schoolName" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="schoolAddress">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="schoolPhone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="schoolEmail">
                    </div>
                    <div class="form-group">
                        <label>Principal</label>
                        <input type="text" id="schoolPrincipal">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" class="btn btn-secondary" onclick="cancelSchoolForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="schoolsList" class="list-container"></div>
        </div>

        <!-- Students Section -->
        <div id="students-section" class="tab-content">
            <div class="section-header">
                <h2>Students</h2>
                <button class="btn btn-primary" onclick="showStudentForm()">+ Add Student</button>
            </div>

            <div class="filter-section">
                <label>Filter by School:</label>
                <select id="schoolFilter" onchange="loadStudents()">
                    <option value="">All Schools</option>
                </select>
            </div>

            <div id="studentForm" class="form-container" style="display: none;">
                <h3 id="studentFormTitle">Add New Student</h3>
                <form onsubmit="saveStudent(event)">
                    <input type="hidden" id="studentId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" id="studentFirstName" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" id="studentLastName" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="studentDOB">
                        </div>
                        <div class="form-group">
                            <label>Grade</label>
                            <input type="text" id="studentGrade">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>School</label>
                        <select id="studentSchool">
                            <option value="">Select School</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Enrollment Date</label>
                        <input type="date" id="studentEnrollmentDate">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="studentEmail">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="studentPhone">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="studentAddress">
                    </div>
                    <h4>Parent Information</h4>
                    <div class="form-group">
                        <label>Parent Name</label>
                        <input type="text" id="studentParentName">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Parent Phone</label>
                            <input type="tel" id="studentParentPhone">
                        </div>
                        <div class="form-group">
                            <label>Parent Email</label>
                            <input type="email" id="studentParentEmail">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="studentStatus">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="graduated">Graduated</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" class="btn btn-secondary" onclick="cancelStudentForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="studentsList" class="list-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
